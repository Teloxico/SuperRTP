name: SuperRTP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_full_replay:
        description: 'Execute live Xvfb/ffmpeg replay and regenerate evidence'
        type: boolean
        default: false

jobs:
  verify:
    name: Verify Vertical Slice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (EasyRPG Player, liblcf, sdl2_sound, Xvfb, ffmpeg, mkxp-z libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libpixman-1-dev libuchardet-dev libasound2 \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libopenal-dev libvorbis-dev libogg-dev libphysfs-dev libtheora-dev ruby-dev || \
          sudo apt-get install -y xvfb ffmpeg libpixman-1-dev libuchardet-dev libasound2t64 \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libopenal-dev libvorbis-dev libogg-dev libphysfs-dev libtheora-dev ruby-dev
          sudo ar cr /usr/local/lib/libiconv.a
          sudo ar cr /usr/local/lib/libcharset.a
          curl -sL https://easyrpg.org/downloads/player/0.8.1.1/easyrpg-player-0.8.1.1-linux.tar.gz | sudo tar -xzf - -C /usr/local/bin
          easyrpg-player --version
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install liblcf sdl2_sound
          echo "PKG_CONFIG_PATH=/home/linuxbrew/.linuxbrew/opt/liblcf/lib/pkgconfig:/home/linuxbrew/.linuxbrew/opt/sdl2_sound/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/home/linuxbrew/.linuxbrew/opt/liblcf/lib:/home/linuxbrew/.linuxbrew/opt/sdl2_sound/lib:/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/home/linuxbrew/.linuxbrew/opt/liblcf/lib:/home/linuxbrew/.linuxbrew/opt/sdl2_sound/lib:/usr/local/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Cache mkxp-z binary
        uses: actions/cache@v4
        id: mkxp-cache
        with:
          path: |
            ~/.local/bin/mkxp-z
            ~/.local/bin/mkxp-z.build.json
          key: ${{ runner.os }}-${{ runner.arch }}-mkxp-z-826929eeb3ebc4b887c011604919217a790770f4-ruby3.2-buildcfg2

      - name: Install mkxp-z (RGSS1/RGSS2 runner)
        run: |
          mkdir -p "$HOME/.local/bin"
          tools/install_mkxp_z_ci.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build target packs (RM2000, RM2003, RMXP, RMVX, RMVXAce)
        run: |
          python3 tools/build_target.py --target rm2000 --clean
          python3 tools/build_target.py --target rm2003 --clean
          python3 tools/build_target.py --target rmxp --clean
          python3 tools/build_target.py --target rmvx --clean
          python3 tools/build_target.py --target rmvxace --clean

      - name: Run automated test suite on committed repository state
        env:
          SUPERRTP_REQUIRE_RUNTIME: "1"
        run: |
          python3 tests/test_vertical_slice.py
          python3 tests/test_rmxp_vertical_slice.py
          python3 tests/test_rmvx_vertical_slice.py
          python3 tests/test_rmvxace_vertical_slice.py

      - name: Verify generator reproducibility and assert zero git diff
        run: |
          python3 tools/generate_fixture_graphics.py
          python3 tools/generate_calibration_charset.py
          python3 tools/generate_calibration_chipset.py
          git diff --exit-code

      - name: Validate target packs
        run: |
          python3 tools/validate_target.py --target rm2000
          python3 tools/validate_target.py --target rm2003
          python3 tools/validate_target.py --target rmxp
          python3 tools/validate_target.py --target rmvx
          python3 tools/validate_target.py --target rmvxace

      - name: Verify runtime evidence chain
        run: |
          python3 tools/verify_runtime.py --target all --verify
          python3 tools/verify_chipset_runtime.py --target all --verify
          python3 tools/verify_rmxp_runtime.py --verify
          python3 tools/verify_rmvx_runtime.py --verify
          python3 tools/verify_rmvxace_runtime.py --verify

      - name: Optional full visual replay (manual dispatch)
        if: ${{ inputs.run_full_replay == true }}
        run: |
          python3 tools/verify_runtime.py --target all --run-replay
          python3 tools/verify_chipset_runtime.py --target all --run-capture
          python3 tools/verify_rmxp_runtime.py --run-capture
          python3 tools/verify_rmvx_runtime.py --run-capture
          python3 tools/verify_rmvxace_runtime.py --run-capture


